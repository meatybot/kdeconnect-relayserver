#
# For a pushed v* tag: runs CI, builds Linux binaries for x86_64 and aarch64, publishes them with
# the systemd unit, a source tarball and SHA256SUMS as a GitHub release, and pushes a multi-arch
# image to ghcr.io/<owner>/kdeconnect-relayserver.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref_name }}

  binaries:
    needs: ci
    name: binary-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    # Oldest supported distribution, so the binary runs on it and everything newer
    container: ubuntu:24.04
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build g++ qt6-base-dev git ca-certificates
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Check the tag matches the project version
        run: |
          version=$(sed -n 's/^project(kdeconnect-relayserver VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          [ "v$version" = "$TAG" ] || { echo "Tag $TAG does not match project version $version"; exit 1; }
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - name: Collect
        run: |
          DESTDIR=$PWD/install cmake --install build --strip
          mkdir dist
          cp install/usr/bin/kdeconnect-relayserver "dist/kdeconnect-relayserver-$TAG-linux-${{ matrix.arch }}"
          # The unit is the same for every architecture, attach it once
          if [ "${{ matrix.arch }}" = x86_64 ]; then
            cp install/usr/lib/systemd/system/kdeconnect-relayserver.service dist/
          fi
          ./dist/kdeconnect-relayserver-$TAG-linux-${{ matrix.arch }} --version
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: dist/

  image:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Tags
        id: meta
        run: |
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/kdeconnect-relayserver"
          version="${TAG#v}"
          echo "tags=$image:$version,$image:${version%.*},$image:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        env:
          # The build record artifact breaks the merged artifact download in the publish job
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=Relay server for KDE Connect devices on different networks

  publish:
    needs: [binaries, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true
      - name: Source tarball and checksums
        run: |
          git archive --format=tar.gz --prefix="kdeconnect-relayserver-$TAG/" -o "dist/kdeconnect-relayserver-$TAG.tar.gz" HEAD
          cd dist && sha256sum * > SHA256SUMS && ls -la
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" dist/* --clobber
